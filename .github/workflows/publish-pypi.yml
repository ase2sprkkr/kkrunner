# Configure PyPI Trusted Publishing before public distribution:
# owner ase2sprkkr, repository kkrunner, workflow publish-pypi.yml, environment pypi.
# Protect that environment with reviewers and v* tag rules.
name: Publish to PyPI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Check tagged candidate
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = tag
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PYTHONPATH: ''
        run: |
          python - <<'PY'
          import os, pathlib, tomllib

          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Tag must be {expected}, not {os.environ["RELEASE_TAG"]}')
          PY

  validate:
    needs: release-check
    uses: ./.github/workflows/validate.yml

  publish:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kkrunner/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish the tested artifacts with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
