[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kkrunner"
version = "0.1.0.dev0"
description = "Program-independent local and remote scientific job execution"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENCE"]
dependencies = ["platformdirs"]

[project.optional-dependencies]
psij = ["psij-python>=0.9.11"]
test = ["pytest"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=3", "myst-parser>=3"]

[project.scripts]
kkrunner = "kkrunner.cli:main"
kkrunner-remote = "kkrunner.cli:remote_main"

[project.urls]
Documentation = "https://ase2sprkkr.github.io/kkrunner/"
Source = "https://github.com/ase2sprkkr/kkrunner"
Issues = "https://github.com/ase2sprkkr/kkrunner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow integration tests", "integration: external services required"]

[tool.ruff]
line-length = 120
